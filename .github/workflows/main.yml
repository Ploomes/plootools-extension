name: Deploy Extension in VSCode

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null && contains(github.event.comment.body, 'run:publish'))
    runs-on: ubuntu-latest

    steps:
      - name: Check commenter has write access
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission --jq .permission)
          echo "Commenter ${{ github.event.comment.user.login }} has permission: $PERMISSION"
          if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "write" ]]; then
            echo "Commenter does not have write access. Aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install `vsce`
        run: npm i -g @vscode/vsce

      - name: Bump version (but don't push yet)
        id: versioning
        run: |
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config user.name "$GITHUB_ACTOR"

          VERSION=$(npm version patch --message "v%s")
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Package Extension
        run: vsce package --no-dependencies

      - name: Publish Extension to Marketplace
        id: publish
        run: |
          if vsce publish -p "${{ secrets.VSCE_PAT }}"; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "Publishing failed"
            echo "published=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Push version and tags
        if: steps.publish.outputs.published == 'true'
        run: git push origin main --follow-tags

      - name: Rollback version and tag (if publish failed)
        if: failure()
        run: |
          echo "Rolling back tag and version"
          git tag -d ${{ env.TAG }} || true
          git push origin :refs/tags/${{ env.TAG }} || true
          git reset --hard HEAD~1
